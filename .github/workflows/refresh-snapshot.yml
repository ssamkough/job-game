name: Refresh snapshot

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate anonymized data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/generate.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json scripts/aliases.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Refresh anonymized snapshot from Notion"
          git push
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: f03f5204-4398-44ab-b693-c5740e009a2c
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Skipping Netlify deploy (no NETLIFY_AUTH_TOKEN)"
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --prod --dir . --site "$NETLIFY_SITE_ID"
