name: Refresh snapshot

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate anonymized data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/generate.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json scripts/aliases.json hidden/data.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Refresh anonymized snapshot from Notion"
          git push
      - name: Text snapshot summary
        env:
          TEXTBELT_KEY: ${{ secrets.TEXTBELT_KEY }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: |
          if [ -z "$TEXTBELT_KEY" ] || [ -z "$SMS_TO" ]; then
            echo "Skipping SMS: set repo secrets TEXTBELT_KEY and SMS_TO"
            exit 0
          fi
          message=$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data.json").read_text())
          totals = data["totals"]
          kinds = data.get("meetingKinds") or {}
          companies = data.get("companyStatusThisSearch") or {}

          kind_order = ("onsite", "technical", "intro", "recruiter", "other")
          kind_bits = [f"{kinds[key]} {key}" for key in kind_order if kinds.get(key)]
          company_order = (
              ("Finding role...", "finding role"),
              ("Applied", "applied"),
              ("Interviewing", "interviewing"),
              ("Take-Home", "take-home"),
              ("Negotating", "negotiating"),
              ("Negotiating", "negotiating"),
              ("Interviewed", "interviewed"),
          )
          company_bits = [
              f"{companies[key]} {label}"
              for key, label in company_order
              if companies.get(key)
          ]

          lines = [
              f"Job Game {data.get('generatedOn')}",
              (
                  f"{totals.get('applications', 0)} applications submitted "
                  f"({totals.get('recruiters', 0)} recruiter, {totals.get('referrals', 0)} referral)"
              ),
              f"{totals.get('meetings', 0)} meetings"
              + (f" ({', '.join(kind_bits)})" if kind_bits else ""),
              f"{totals.get('companiesThisSearch', 0)} companies"
              + (f" ({', '.join(company_bits)})" if company_bits else ""),
          ]
          print("\n".join(lines))
          PY
          )
          echo "Sending:"
          echo "$message"
          resp=$(curl -sS https://textbelt.com/text \
            --data-urlencode phone="$SMS_TO" \
            --data-urlencode message="$message" \
            -d key="$TEXTBELT_KEY")
          echo "$resp"
          python3 -c "import json,sys; r=json.loads(sys.argv[1]); print(r.get('error') or 'sent'); sys.exit(0 if r.get('success') else 1)" "$resp"
