<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="description" content="Sammy Samkough's Job Game 2026" />
    <title>Job Game 2026</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>
        <img src="./glove.png" alt="" width="40" height="40" />
        Job Game 2026
      </h1>
      <p>
        Public log of this search. Company names, people, and links stay in
        Notion. Everyone here is an alias.
      </p>
      <p id="generated"></p>

      <dl class="counts" id="stats"></dl>

      <div class="tabs" role="tablist" aria-label="Records">
        <button type="button" role="tab" id="tab-meetings" aria-controls="panel-meetings" data-tab="meetings">
          Meetings
        </button>
        <button type="button" role="tab" id="tab-applications" aria-controls="panel-applications" data-tab="applications">
          Applications
        </button>
        <button type="button" role="tab" id="tab-companies" aria-controls="panel-companies" data-tab="companies">
          Companies
        </button>
      </div>

      <section class="panel" id="panel-meetings" role="tabpanel" aria-labelledby="tab-meetings">
        <div class="panel-head">
          <h2>Meetings</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Kind</th>
                <th>Company</th>
              </tr>
            </thead>
            <tbody id="timeline"></tbody>
            <tfoot>
              <tr>
                <td colspan="3" id="meeting-count"></td>
              </tr>
            </tfoot>
          </table>
          <p class="sentinel" data-for="timeline"></p>
        </div>
      </section>

      <section class="panel" id="panel-applications" role="tabpanel" aria-labelledby="tab-applications" hidden>
        <div class="panel-head">
          <h2>Applications</h2>
          <label>
            Status
            <select id="app-filter">
              <option value="all">All</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Submitted</th>
                <th>Company</th>
                <th>Status</th>
                <th>Board</th>
                <th>Referral</th>
              </tr>
            </thead>
            <tbody id="app-rows"></tbody>
            <tfoot>
              <tr>
                <td colspan="5" id="app-count"></td>
              </tr>
            </tfoot>
          </table>
          <p class="sentinel" data-for="app-rows"></p>
        </div>
      </section>

      <section class="panel" id="panel-companies" role="tabpanel" aria-labelledby="tab-companies" hidden>
        <div class="panel-head">
          <h2>Companies</h2>
          <label>
            Status
            <select id="company-filter">
              <option value="all">All</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Company</th>
                <th>Status</th>
                <th>Role</th>
                <th>Meetings</th>
                <th>First interview</th>
              </tr>
            </thead>
            <tbody id="company-rows"></tbody>
            <tfoot>
              <tr>
                <td colspan="5" id="company-count"></td>
              </tr>
            </tfoot>
          </table>
          <p class="sentinel" data-for="company-rows"></p>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
